<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSALINA HUB</title>
  <style>
    /* ... Maandishi yako ya CSS ... */
    body { font-family: system-ui, sans-serif; background: #f5f3ff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: white; padding: 2rem; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 400px; width: 100%; text-align: center; }
    button { background: #6d28d9; color: white; border: none; padding: 12px 24px; border-radius: 40px; font-size: 1rem; font-weight: bold; width: 100%; margin-top: 16px; cursor: pointer; }
    button:active { transform: scale(0.97); }
    #status { margin-top: 16px; padding: 10px; border-radius: 12px; background: #f3f4f6; color: #4b5563; }
  </style>
</head>
<body>

<div class="card">
  <h1>📍 MSALINA HUB</h1>
  <p style="color: #6b7280;">Pi Browser DApp Directory</p>
  <div id="userDisplay" style="margin: 20px 0; font-size: 1.2rem;">👤 Guest</div>
  <button id="loginButton">🔑 Login with Pi</button>
  <button id="logoutButton" style="display: none; background: #9ca3af;">🚪 Logout</button>
  <div id="status">⏳ Loading Pi SDK...</div>
</div>

<script>
  // ============================================================
  // 1. FUNGA SDK KWA NJIA IMARA
  // ============================================================
  function loadPiSDK() {
    return new Promise((resolve, reject) => {
      // Ikiwa tayari ipo, endelea
      if (typeof Pi !== 'undefined') {
        resolve(Pi);
        return;
      }

      // Unda kipengele cha script
      const script = document.createElement('script');
      script.src = 'https://sdk.minepi.com/pi-sdk.js';
      script.async = true;

      // Ikiwa imepakiwa
      script.onload = () => {
        // Subiri kidogo ili iwe tayari
        setTimeout(() => {
          if (typeof Pi !== 'undefined') {
            resolve(Pi);
          } else {
            reject(new Error('Pi SDK still undefined after load'));
          }
        }, 500);
      };

      // Ikiwa imeshindwa
      script.onerror = () => {
        reject(new Error('Failed to load Pi SDK'));
      };

      document.head.appendChild(script);
    });
  }

  // ============================================================
  // 2. APP
  // ============================================================
  let piUser = null;
  let piAccessToken = null;

  const statusEl = document.getElementById('status');
  const userDisplay = document.getElementById('userDisplay');
  const loginBtn = document.getElementById('loginButton');
  const logoutBtn = document.getElementById('logoutButton');

  function updateStatus(message, type = 'info') {
    statusEl.textContent = message;
    statusEl.style.background = type === 'error' ? '#fee2e2' : '#f3f4f6';
    statusEl.style.color = type === 'error' ? '#991b1b' : '#4b5563';
  }

  function updateUI() {
    if (piUser) {
      userDisplay.textContent = `👤 ${piUser.username || 'User'}`;
      loginBtn.style.display = 'none';
      logoutBtn.style.display = 'block';
      updateStatus(`✅ Logged in as ${piUser.username}`, 'success');
    } else {
      userDisplay.textContent = '👤 Guest';
      loginBtn.style.display = 'block';
      logoutBtn.style.display = 'none';
      updateStatus('🔑 Please login to continue', 'info');
    }
  }

  // ============================================================
  // 3. KAZI ZA PI
  // ============================================================
  async function initApp() {
    try {
      updateStatus('⏳ Loading Pi SDK...', 'info');
      await loadPiSDK();
      updateStatus('✅ Pi SDK loaded!', 'info');

      // Anzisha Pi
      await Pi.init();
      updateStatus('✅ Pi SDK initialized!', 'info');

      // Jaribu kuingia kiotomatiki
      try {
        const auth = await Pi.authenticate(['username']);
        piUser = auth.user;
        piAccessToken = auth.accessToken;
        updateUI();
      } catch (error) {
        updateStatus('🔑 Please click Login button', 'info');
        updateUI();
      }

    } catch (error) {
      console.error('❌ Init error:', error);
      updateStatus(`❌ ${error.message}`, 'error');
    }
  }

  async function handleLogin() {
    try {
      updateStatus('⏳ Logging in...', 'info');

      // Hakikisha SDK imepakiwa
      if (typeof Pi === 'undefined') {
        await loadPiSDK();
      }

      // Hakikisha imeanzishwa
      try { await Pi.init(); } catch (e) {}

      const auth = await Pi.authenticate(['username']);
      piUser = auth.user;
      piAccessToken = auth.accessToken;
      updateUI();

      // (Hiari) Tuma kwa backend
      try {
        await fetch('https://PamojaMart-railway.com/api/auth/pi', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accessToken: piAccessToken })
        });
      } catch (e) { /* pumzika */ }

    } catch (error) {
      console.error('❌ Login error:', error);
      updateStatus(`❌ Login failed: ${error.message}`, 'error');
    }
  }

  function handleLogout() {
    piUser = null;
    piAccessToken = null;
    updateUI();
    updateStatus('🔑 Logged out', 'info');
  }

  // ============================================================
  // 4. ANZA
  // ============================================================
  loginBtn.onclick = handleLogin;
  logoutBtn.onclick = handleLogout;

  // Anza app mara tu DOM inapopakiwa
  if (document.readyState === 'complete') {
    initApp();
  } else {
    document.addEventListener('DOMContentLoaded', initApp);
  }

  // Hifadhi: jaribu tena baada ya sekunde 5
  setTimeout(() => {
    if (typeof Pi === 'undefined') {
      updateStatus('⚠️ Trying to reload SDK...', 'info');
      loadPiSDK().then(() => {
        updateStatus('✅ SDK reloaded!', 'info');
        initApp();
      }).catch(() => {
        updateStatus('❌ Failed to reload SDK. Please refresh.', 'error');
      });
    }
  }, 5000);
</script>

</body>
</html>
