<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSALINA HUB</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f5f3ff;
      margin:0;
      padding:20px;
    }
    .hero{
      background:linear-gradient(135deg,#6d28d9,#9333ea);
      color:white;
      padding:30px 20px;
      border-radius:24px;
      text-align:center;
      margin-bottom:20px;
    }
    .search{
      width:100%;
      padding:16px;
      border:none;
      border-radius:16px;
      font-size:18px;
      margin-top:15px;
      box-sizing:border-box;
    }
    h2{
      color:#6d28d9;
    }
    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
    }
    .card{
      background:white;
      border-radius:22px;
      padding:24px 16px;
      text-align:center;
      font-size:20px;
      font-weight:bold;
      cursor:pointer;
      box-shadow:0 4px 12px rgba(0,0,0,.08);
    }
  </style>
</head>
<body>

  <div class="hero">
    <h1>MSALINA HUB</h1>
    <p>Pi Browser DApps for Tanzania & East Africa</p>
    <input class="search" placeholder="Search DApps...">
  </div>

  <h2>Categories</h2>

  <div class="grid">
    <div class="card" onclick="openCategory('finance')">💰 Finance</div>
    <div class="card">🏦 Banking</div>
    <div class="card">🛒 E-Commerce</div>
    <div class="card">🚗 Transport</div>
    <div class="card">🏥 Health</div>
    <div class="card">🎓 Education</div>
    <div class="card">💼 Business</div>
    <div class="card">🏠 Real Estate</div>
    <div class="card">🍽 Food</div>
    <div class="card">🎮 Entertainment</div>
    <div class="card">👨‍💻 Technology</div>
    <div class="card">🌐 Other</div>
  </div>

</body>
</html>
