<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSALINA HUB</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f3ff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: white; padding: 2rem; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 400px; width: 100%; text-align: center; }
    h1 { color: #6d28d9; margin-bottom: 4px; }
    .sub { color: #6b7280; font-size: 14px; margin-bottom: 20px; }
    .user-box { background: #f5f3ff; padding: 16px; border-radius: 16px; margin-bottom: 16px; }
    .user-box .avatar { font-size: 40px; }
    .user-box .name { font-size: 18px; font-weight: 600; color: #1e1b2e; margin-top: 4px; }
    .btn { background: #6d28d9; color: white; border: none; padding: 14px; border-radius: 40px; font-size: 18px; font-weight: 600; cursor: pointer; width: 100%; transition: 0.2s; }
    .btn:active { transform: scale(0.96); }
    .btn-logout { background: #e5e1ef; color: #1e1b2e; }
    #status { margin-top: 16px; padding: 12px; border-radius: 12px; font-size: 14px; min-height: 50px; }
    .status-info { background: #dbeafe; color: #1e40af; }
    .status-success { background: #d1fae5; color: #065f46; }
    .status-error { background: #fee2e2; color: #991b1b; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="card">
  <h1>📍 MSALINA HUB</h1>
  <p class="sub">Pi Browser DApp Directory</p>

  <div class="user-box">
    <div class="avatar" id="userAvatar">👤</div>
    <div class="name" id="userName">Guest</div>
  </div>

  <button class="btn" id="loginBtn" onclick="handleLogin()">🔑 Login with Pi</button>
  <button class="btn btn-logout hidden" id="logoutBtn" onclick="handleLogout()">🚪 Logout</button>

  <div id="status" class="status-info">⏳ Loading...</div>
</div>

<!-- Pi SDK -->
<script src="https://sdk.minepi.com/pi-sdk.js">
</script>

<script>
  // ============================================================
  // STATE
  // ============================================================
  let piUser = null;
  let piAccessToken = null;
  let isInitialized = false;

  const statusEl = document.getElementById('status');
  const userNameEl = document.getElementById('userName');
  const userAvatarEl = document.getElementById('userAvatar');
  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');

  // ============================================================
  // UI HELPERS
  // ============================================================
  function setStatus(msg, type = 'info') {
    statusEl.textContent = msg;
    statusEl.className = 'status-' + type;
  }

  function updateUI() {
    if (piUser) {
      userNameEl.textContent = piUser.username || 'User';
      userAvatarEl.textContent = piUser.username ? piUser.username[0].toUpperCase() : '👤';
      loginBtn.classList.add('hidden');
      logoutBtn.classList.remove('hidden');
      setStatus('✅ Logged in as ' + (piUser.username || 'User'), 'success');
    } else {
      userNameEl.textContent = 'Guest';
      userAvatarEl.textContent = '👤';
      loginBtn.classList.remove('hidden');
      logoutBtn.classList.add('hidden');
      setStatus('🔑 Please login to continue', 'info');
    }
  }

  // ============================================================
  // PI SDK - NJIA RAHISI
  // ============================================================
  async function initPiSDK() {
    try {
      setStatus('⏳ Initializing Pi SDK...', 'info');

      // Subiri hadi SDK ipatikane
      let attempts = 0;
      while (typeof Pi === 'undefined' && attempts < 30) {
        await new Promise(r => setTimeout(r, 500));
        attempts++;
        console.log(`⏳ Waiting for Pi... attempt ${attempts}`);
      }

      if (typeof Pi === 'undefined') {
        setStatus('❌ Pi SDK not loaded. Please use Pi Browser.', 'error');
        return false;
      }

      console.log('✅ Pi SDK found!');

      // HAKIKISHA Pi.init() INAITWA
      try {
        await Pi.init();
        console.log('✅ Pi.init() successful!');
        isInitialized = true;
        setStatus('✅ Pi SDK initialized!', 'info');
        return true;
      } catch (initError) {
        console.error('❌ Pi.init() error:', initError);
        setStatus('❌ Pi.init() failed: ' + initError.message, 'error');
        return false;
      }

    } catch (error) {
      console.error('❌ Init error:', error);
      setStatus('❌ Error: ' + error.message, 'error');
      return false;
    }
  }

  // ============================================================
  // LOGIN / LOGOUT
  // ============================================================
  async function handleLogin() {
    try {
      setStatus('⏳ Logging in...', 'info');

      // Hakikisha SDK imeanzishwa
      if (!isInitialized) {
        const ok = await initPiSDK();
        if (!ok) {
          setStatus('❌ SDK not ready. Please refresh.', 'error');
          return;
        }
      }

      // Hakikisha Pi.init() imeitwa
      if (typeof Pi !== 'undefined' && !isInitialized) {
        await Pi.init();
        isInitialized = true;
      }

      console.log('🔑 Calling Pi.authenticate...');
      const auth = await Pi.authenticate(['username']);
      console.log('✅ Auth successful!', auth);

      piUser = auth.user;
      piAccessToken = auth.accessToken;
      updateUI();

      // Tuma kwa backend (hiari)
      try {
        const res = await fetch('https://PamojaMart-railway.com/api/auth/pi', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accessToken: piAccessToken })
        });
        if (res.ok) console.log('✅ Backend OK');
      } catch (e) { console.log('ℹ️ Backend not available'); }

    } catch (error) {
      console.error('❌ Login error:', error);
      setStatus('❌ Login failed: ' + error.message, 'error');
    }
  }

  function handleLogout() {
    piUser = null;
    piAccessToken = null;
    isInitialized = false;
    updateUI();
    setStatus('🔑 Logged out', 'info');
  }

  // ============================================================
  // AUTO-LOGIN
  // ============================================================
  async function autoLogin() {
    try {
      console.log('🔑 Attempting auto-login...');
      if (!isInitialized) {
        const ok = await initPiSDK();
        if (!ok) return;
      }
      const auth = await Pi.authenticate(['username']);
      piUser = auth.user;
      piAccessToken = auth.accessToken;
      updateUI();
      console.log('✅ Auto-login successful!');
    } catch (error) {
      console.log('ℹ️ Auto-login skipped:', error.message);
      updateUI();
    }
  }

  // ============================================================
  // START
  // ============================================================
  async function startApp() {
    setStatus('⏳ Starting app...', 'info');
    await initPiSDK();
    await autoLogin();
  }

  // Anza app
  if (document.readyState === 'complete') {
    startApp();
  } else {
    document.addEventListener('DOMContentLoaded', startApp);
  }

  // Fallback: jaribu tena baada ya 3s
  setTimeout(() => {
    if (!isInitialized && typeof Pi !== 'undefined') {
      console.log('🔄 Retrying Pi.init()...');
      Pi.init().then(() => {
        isInitialized = true;
        setStatus('✅ Pi SDK initialized!', 'info');
        autoLogin();
      }).catch(e => console.error('Retry failed:', e));
    }
  }, 3000);
</script>

</body>
</html>
